baseURL = 'https://nothing-but-myself.github.io/'
languageCode = 'zh-CN'
title = 'Zigzagging Blog'
theme = 'hugo-modus'
copyright = '© 2026 zigzagging.io'

enableRobotsTXT = true
disableKinds = ['RSS']

[params]
  description = 'Sharing my tech insights, thoughts, and lifestyle.'

[permalinks]
  posts = '/:slug/'

[markup]
  [markup.highlight]
    noClasses = false

[outputs]
  page = ["html", "markdown"]

[menus]
  [[menus.main]]
    name = 'Tags'
    url = '/tags/'
    weight = 40
  [[menus.main]]
    name = 'Projects'
    url = 'https://apps.zigzagging.io'
    weight = 50
